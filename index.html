<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Seed</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="garden-decor" aria-hidden="true">
      <div class="background-hill hill-left"></div>
      <div class="background-hill hill-right"></div>

      <div class="edge-plant edge-plant-left">
        <span class="edge-stem"></span>
        <span class="edge-leaf edge-leaf-one"></span>
        <span class="edge-leaf edge-leaf-two"></span>
        <span class="edge-leaf edge-leaf-three"></span>
      </div>

      <div class="edge-plant edge-plant-right">
        <span class="edge-stem"></span>
        <span class="edge-leaf edge-leaf-one"></span>
        <span class="edge-leaf edge-leaf-two"></span>
        <span class="edge-leaf edge-leaf-three"></span>
      </div>

      <span class="tiny-flower flower-left"></span>
      <span class="tiny-flower flower-right"></span>
    </div>

    <main class="mood-seed-card">
      <h1>Mood Seed</h1>
      <p class="question">How are you feeling today?</p>

      <div class="mood-options" aria-label="Choose your mood">
        <button
          class="mood-button"
          type="button"
          data-mood="great"
          aria-pressed="false"
        >
          Great
        </button>
        <button
          class="mood-button"
          type="button"
          data-mood="okay"
          aria-pressed="false"
        >
          Okay
        </button>
        <button
          class="mood-button"
          type="button"
          data-mood="sad"
          aria-pressed="false"
        >
          Sad
        </button>
      </div>

      <section class="garden" aria-label="Your mood plant">
        <div class="sun" aria-hidden="true"></div>

        <div class="water-drops" aria-hidden="true">
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
          <span class="drop"></span>
        </div>

        <div class="plant" aria-hidden="true">
          <div class="plant-shape">
            <span class="stem"></span>
            <span class="leaf leaf-left leaf-upper"></span>
            <span class="leaf leaf-right leaf-upper"></span>
            <span class="leaf leaf-left leaf-lower"></span>
            <span class="leaf leaf-right leaf-lower"></span>
          </div>
        </div>

        <div class="soil" aria-hidden="true"></div>
      </section>

      <button class="water-button" type="button" disabled>
        Water my seed
      </button>

      <p class="supportive-message" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
